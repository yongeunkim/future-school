<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2040 미래 교실 리모델링</title>
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
</head>
<body>
<title>2040 미래 교실 리모델링</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
<style>
/* Layout: one warm reading column (max 880px) with a sticky school header and a step rail; teacher view widens to a control board. */
:root{
  --bg:#FBF4EA; --surface:#FFFCF7; --sand:#F4E6D4; --peach:#FBE2CC; --peach-2:#F6C9A2;
  --accent:#EC9A5E; --accent-ink:#A9561F; --on-accent:#2E1A0B;
  --ink:#3B2C22; --muted:#86705F; --line:#EADBC8;
  --good:#4E8A5A; --good-bg:#E2EFE1; --bad:#B9563F; --bad-bg:#F8E0D8;
  --shadow:0 1px 2px rgba(91,60,30,.06),0 8px 24px rgba(91,60,30,.07);
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-display:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1D1611; --surface:#271F19; --sand:#31261D; --peach:#44301F; --peach-2:#5A3D27;
  --accent:#F0A46B; --accent-ink:#F5BE92; --on-accent:#2A170A;
  --ink:#F3E7DA; --muted:#B9A38E; --line:#41342A;
  --good:#8DC598; --good-bg:#203325; --bad:#E58D77; --bad-bg:#3B241E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1D1611; --surface:#271F19; --sand:#31261D; --peach:#44301F; --peach-2:#5A3D27;
  --accent:#F0A46B; --accent-ink:#F5BE92; --on-accent:#2A170A;
  --ink:#F3E7DA; --muted:#B9A38E; --line:#41342A;
  --good:#8DC598; --good-bg:#203325; --bad:#E58D77; --bad-bg:#3B241E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;letter-spacing:-.005em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:880px;margin:0 auto}
.wide .wrap{max-width:1180px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px}
.bar{display:flex;align-items:center;gap:12px}
.bar .logo{height:26px;width:auto}
.bar .school{font-weight:700;font-size:17px;padding-left:12px;border-left:1px solid var(--line);white-space:nowrap}
.bar .unit{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .sp{flex:1}
.pill{font-size:15px;display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--peach);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.over{background:var(--bad-bg);color:var(--bad)}
.who{font-size:14px;color:var(--muted);white-space:nowrap}
.rail{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:15px;cursor:pointer;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.chip.done{color:var(--ink)}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.chip .lk{margin-left:5px;vertical-align:-1px}

/* surfaces */
main{padding-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.stack{display:grid;gap:16px}
.eyebrow{font-size:14px;letter-spacing:.01em;color:var(--accent-ink);font-weight:700}
.title{font-size:28px;margin-top:4px}
.lead{color:var(--muted);margin-top:6px}
.muted{color:var(--muted)}
.small{font-size:14.5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:680px){.grid3,.grid2{grid-template-columns:1fr}.title{font-size:24px}.card{padding:18px}}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:linear-gradient(180deg,var(--peach),var(--surface));border:1px solid var(--line);border-radius:var(--r);padding:24px 24px 0}
.hero h1{font-size:34px}
.hero img{width:170px;align-self:end}
.hero .txt{padding-bottom:24px}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero img{width:140px;justify-self:center}}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.soft{background:var(--peach);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:6px}
.field label{font-size:15.5px;font-weight:500}
.input,.ta{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px}
.ta{min-height:84px;resize:vertical;line-height:1.55}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-width:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* speech */
.guide{display:flex;gap:12px;align-items:flex-end}
.guide img{width:84px;flex:none}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 16px;font-family:var(--f-display);font-size:17px}

/* quiz */
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.fb{font-size:14px;margin-top:4px}

/* question + promises */
.bigq{background:var(--peach);border-radius:var(--r);padding:28px 24px;text-align:center}
.bigq .q{font-family:var(--f-display);font-size:30px;line-height:1.35;margin-top:6px}
.promise{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.promise .tag{font-size:13px;font-weight:700;color:var(--accent-ink)}
.promise .say{font-family:var(--f-display);font-size:19px;margin:4px 0 8px}
ol.goals{margin:0;padding-left:20px;display:grid;gap:4px}

/* library */
.notice{background:var(--sand);border-radius:10px;padding:9px 14px;font-size:14.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:15.5px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.doc h3{font-size:21px}
.doc .src{font-size:14px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .k{font-size:14.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tagc{background:var(--peach);border-radius:999px;padding:3px 11px;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:15.5px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:400;color:var(--muted);font-size:14.5px}
.tblwrap{overflow-x:auto}
.cmp{display:grid;gap:12px}
.cmp .lab{font-size:15.5px;display:flex;justify-content:space-between;gap:8px}
.cmp .lab b{font-variant-numeric:tabular-nums}
.track{display:grid;gap:4px;margin-top:4px}
.bar2{height:12px;border-radius:6px;background:var(--line);position:relative;overflow:hidden}
.bar2 i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.bar2.before i{background:var(--peach-2)}
.bar2.after i{background:var(--accent)}
.legend{display:flex;gap:14px;font-size:14px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.log{font-size:15.5px;border-left:3px solid var(--peach-2);padding:2px 0 2px 12px;display:grid;gap:4px}
.quote{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:16px}
.real{border:1px dashed var(--accent);border-radius:12px;padding:12px 16px;font-size:15.5px}
.real b{color:var(--accent-ink)}
.msg-ai{display:grid;gap:6px}
.chatline{border-radius:12px;padding:10px 14px;max-width:85%}

/* flaw cards */
.flaw{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;cursor:pointer;text-align:left;display:grid;gap:6px;align-content:start}
.flaw .n{font-size:13.5px;font-weight:700;color:var(--accent-ink)}
.flaw .h{font-family:var(--f-display);font-size:21px}
.flaw.on{border-color:var(--accent);background:var(--peach)}
.flip{perspective:1200px}
.flip .inner{position:relative;transition:transform .7s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.go .inner{transform:rotateY(180deg)}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r)}
.flip .inner{min-height:360px}
.face.front{position:absolute;inset:0;overflow:hidden;border:2px solid var(--accent);padding:28px 28px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch;
  background-color:var(--peach);background-image:radial-gradient(var(--peach-2) 1.2px,transparent 1.6px);background-size:18px 18px}
.face.front::before{content:"";position:absolute;inset:10px;border:1.5px dashed var(--peach-2);border-radius:10px;pointer-events:none}
.face.front .ftxt{position:relative;display:flex;flex-direction:column;gap:8px;padding-bottom:28px;justify-content:center}
.face.front .fidx{font-size:14px;font-weight:700;letter-spacing:.01em;color:var(--accent-ink)}
.face.front .fhead{font-family:var(--f-display);font-size:32px;line-height:1.25}
.face.front .fline{color:var(--muted)}
.face.front .fart{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.face.front .fart img{width:180px;display:block}
.face.front .fart .bubble{font-size:15px;margin-bottom:6px;white-space:nowrap}
.face.back{transform:rotateY(180deg);background:var(--surface);border:2px solid var(--accent);padding:20px;min-height:360px}
@media (max-width:600px){.face.front{grid-template-columns:1fr;padding:22px 20px 0}.face.front .fart{flex-direction:row;align-items:flex-end;justify-content:flex-end;gap:6px}.face.front .fart img{width:110px}.face.front .fhead{font-size:26px}.face.front .ftxt{padding-bottom:4px}}
.flip:not(.go) + .row .guide{visibility:hidden}
.blank{display:grid;gap:10px;font-size:17px}
.blank .ln{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.blank .ln .n{font-size:13px;font-weight:700;color:var(--accent-ink);width:20px}
.blank .ln .input{flex:1 1 220px;min-width:0}
.fill{background:var(--peach);border-radius:10px;padding:6px 12px;font-weight:500}
.deep{border:2px dashed var(--accent);border-radius:var(--r);padding:16px;display:grid;gap:10px;background:var(--surface)}
.judge{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.judge .lbl{font-size:15px;color:var(--muted);margin-right:4px}
.judge button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:15px}
.judge button.on.g{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.judge button.on.b{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:700}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:1px}
.tab .dot.g{background:var(--good)} .tab .dot.b{background:var(--bad)}
.qrow{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qtag{font-size:13.5px;font-weight:700;border-radius:8px;padding:3px 8px;background:var(--peach);height:fit-content;white-space:nowrap}
.qtag.v{background:var(--ink);color:var(--bg)}
.dim{opacity:.55}

/* tutor */
.tutor{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.tutor{grid-template-columns:1fr}}
.chat{display:grid;gap:10px;min-height:220px;max-height:440px;overflow-y:auto;padding:4px}
.m{display:flex;gap:8px;align-items:flex-end}
.m.me{justify-content:flex-end}
.m .b{border-radius:14px;padding:10px 14px;max-width:85%;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.m.ai .b{background:var(--sand);border-bottom-left-radius:4px}
.m.me .b{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.av svg{width:18px;height:18px}
.starter{border:1px dashed var(--accent);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left}
.ask{display:flex;gap:8px}
.ask .input{flex:1;min-width:0}
.tname{display:flex;align-items:center;gap:8px;font-weight:700}
.tname .st{font-size:12px;font-weight:400;color:var(--muted)}
.verify{background:var(--peach);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.yn{display:flex;gap:8px}
.yn button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;cursor:pointer;font-weight:700}
.yn button.on.y{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.yn button.on.n{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.typing::after{content:"▍";animation:blink 1s steps(2) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}

/* think */
.reveal{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:20px}
.crit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.crit div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;font-family:var(--f-display);font-size:19px}
@media (max-width:560px){.crit{grid-template-columns:1fr}}

/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.keybox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.keybox .input{width:150px}
.foot{margin-top:32px;text-align:center;font-size:13.5px;color:var(--muted)}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13.5px}

/* present overlay */
.present{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
.present .pin{max-width:960px;margin:0 auto;display:grid;gap:18px}
.present h2{font-size:34px}
.present .pv{font-size:22px;line-height:1.5}
.present .pk{font-size:14px;color:var(--accent-ink);font-weight:700}

/* teacher */
.tboard{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.tboard{grid-template-columns:1fr}}
.clock{font-size:76px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.clock.over{color:var(--bad)}
.steplist{display:grid;gap:6px}
.stepbtn{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left}
.stepbtn.on{background:var(--peach);border-color:var(--accent)}
.stepbtn .i{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.stepbtn .t{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.statusline{font-size:13px;padding:6px 10px;border-radius:8px;background:var(--sand)}
.statusline.ok{background:var(--good-bg);color:var(--good)}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px}
.cnt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cnt div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.cnt b{font-size:24px;font-variant-numeric:tabular-nums;display:block}
.hbtn{padding:7px 16px;font-size:15px;text-decoration:none;white-space:nowrap}
.who{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.bar .unit{display:none}.bar{gap:8px}.bar .school{font-size:15px;padding-left:8px}.bar .logo{height:22px}.hbtn{padding:6px 10px;font-size:13px}}
.postbox{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-items:start}
.bcol{background:var(--sand);border-radius:var(--r);padding:12px;display:grid;gap:10px;min-width:0}
.bhead{font-size:20px;display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px}
.bempty{padding:6px 4px}
.pcard{all:unset;box-sizing:border-box;display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;box-shadow:var(--shadow);font-size:15.5px;line-height:1.55;min-width:0;overflow-wrap:anywhere}
.pcard:hover{border-color:var(--accent)}
.pcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pmeta{display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap}
.pa{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:start}
.pa .small{grid-column:2}
.pa p:last-child{grid-column:2}
.sent{font-family:var(--f-display);font-size:17px}
.pbig{display:grid;gap:16px;font-size:20px;line-height:1.6}
.pbig .sent{font-size:26px}
.pbig .pa .small{font-size:15px}
.tbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.tclock{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;min-width:120px}
.tclock.idle{font-size:16px;font-weight:500;color:var(--muted);min-width:auto}
.tclock.over{color:var(--bad)}
.tchips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tchip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px}
.tchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{padding:8px 14px;font-size:14.5px;font-weight:400}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
if (!S.plan || !("think" in S.plan)) S.plan = blank().plan;

const card = () => CONTENT.cards.find(c => c.id === S.card);
function stepDone(i) {
  const k = STEPS[i].key;
  return { enter: !!S.name && S.group, card: !!S.card, reflect: !!((S.ans[S.card] || []).filter(x => (x || "").trim()).length), plan: !!(S.plan.think || "").trim(), close: !!S.reflect.trim() }[k] || false;
}

/* ---------------- header / rail ---------------- */
function renderRail() {
  const rail = $("#rail");
  rail.hidden = BOARD();
  rail.innerHTML = STEPS.map((s, i) => `<button class="chip ${i === S.view ? "on" : ""} ${stepDone(i) ? "done" : ""}" data-go="${i}" ${i > 0 && !(S.name && S.group) ? "disabled" : ""}>${i === 0 ? "" : i + ". "}${esc(s.label)}</button>`).join("");
  $("#who").textContent = S.name && S.group ? `${S.group}조 · ${S.name}` : "";
  $("#boardlink").textContent = BOARD() ? "내 활동으로" : "모아보기";
}

function nav() {
  const i = S.view, last = STEPS.length - 1;
  const ok = !!(S.name && S.group);
  const right = i < last ? `<button class="btn" data-go="${i + 1}" ${ok ? "" : "disabled"}>다음: ${esc(STEPS[i + 1].label)}</button>` : `<button class="btn" data-act="toggleboard">모아보기 보러 가기</button>`;
  return `<div class="nav">${i > 0 ? `<button class="btn ghost" data-go="${i - 1}">이전</button>` : "<span></span>"}${right}</div>`;
}

/* ---------------- screens ---------------- */
const SCREENS = {
  enter() {
    const ready = S.name && S.group;
    return `
    <section class="hero"><div class="txt"><p class="eyebrow">교육학 · 4-2 미래 교육의 변화와 방향</p><h1>${esc(CONTENT.lessonTitle)}</h1><p class="lead">오늘은 2040년 미래 교실을 함께 고쳐 봐요.</p></div><img src="${IMG.hello}" alt="동국 캐릭터 아코"></section>
    <section class="card stack">
      <h2 style="font-size:22px">입장하기</h2>
      <div class="field"><label>우리 조</label><div class="seg">${Array.from({ length: GROUPS }, (_, g) => `<button data-act="group" data-g="${g + 1}" class="${S.group === g + 1 ? "on" : ""}">${g + 1}조</button>`).join("")}</div></div>
      <div class="field"><label for="nm">이름</label><input class="input" id="nm" data-field="name" maxlength="12" placeholder="예: 김동국" value="${esc(S.name)}" autocomplete="off"></div>
    </section>
    <div id="readyOn" ${ready ? "" : "hidden"}>${guide("sit", "준비 완료! 선생님 안내에 따라 자료실로 넘어가요.")}</div>
    <p class="small muted" id="readyOff" ${ready ? "hidden" : ""}>조와 이름을 입력해 주세요.</p>`;
  },
  library() {
    const tabs = [1, 2, 3, 4, 5].map(n => `<button class="tab ${S.lib === n ? "on" : ""}" data-act="lib" data-n="${n}">자료 ${n}${S.judge[n] ? `<span class="dot ${S.judge[n] === "good" ? "g" : "b"}" aria-hidden="true"></span>` : ""}</button>`).join("");
    return `
    <section class="stack" style="gap:10px">
      <div><p class="eyebrow">자료실 탐색</p><h2 class="title">2040 미래고등학교 스마트 교실 자료실</h2>
      <p class="lead">자료를 나눠 맡아 읽고, 어느 자료에 문제가 숨어 있는지 판단해 보세요.</p></div>
      <p class="notice">수업을 위해 구성한 가상 자료입니다. 실제 연구·법은 '실제 사례'로 따로 표시했어요.</p>
      <div class="tabs" role="tablist">${tabs}</div>
      <article class="card doc stack">${(LIB[S.lib] || LIB[1])()}
        <div class="judge"><span class="lbl">이 자료, 어떻게 보이나요?</span><button class="g ${S.judge[S.lib] === "good" ? "on" : ""}" data-act="judge" data-n="${S.lib}" data-v="good">좋은 사례 같아요</button><button class="b ${S.judge[S.lib] === "bad" ? "on" : ""}" data-act="judge" data-n="${S.lib}" data-v="bad">문제가 숨어 있어요</button></div></article>
      <p class="notice">수업을 위해 구성한 가상 자료입니다.</p>
    </section>`;
  },
  card() {
    return `
    <section class="stack">
      <div><p class="eyebrow">가장 큰 결함 고르기</p><h2 class="title">우리 조가 고칠 결함은?</h2><p class="lead">카드 한 장을 고르고, 고른 이유를 한 줄로 적어요.</p></div>
      <div class="grid3">${CONTENT.cards.map((c, i) => `<button class="flaw ${S.card === c.id ? "on" : ""}" data-act="pick" data-c="${c.id}"><span class="n">결함 카드 ${i + 1}</span><span class="h">${esc(c.head)}</span><span class="small">${esc(c.line)}</span></button>`).join("")}</div>
      ${S.card ? `<div class="card field"><label for="why">왜 이 결함이 가장 크다고 생각했나요?</label><input class="input" id="why" data-field="cardReason" maxlength="80" placeholder="한 줄로" value="${esc(S.cardReason)}"></div>` : ""}
    </section>`;
  },
  reflect() {
    const c = card();
    if (!c) return needCard();
    const ans = S.ans[c.id] || [];
    return `
    <section class="stack">
      <div><p class="eyebrow">문제점에 대한 비판적 성찰 · 모둠 토의</p><h2 class="title">카드를 뒤집어 보세요</h2><p class="lead">아직 해결책은 생각하지 않아요. 이 문제를 깊이 들여다보는 시간이에요.</p></div>
      <div class="flip ${S.flipped ? "go" : ""}" id="flip"><div class="inner">
        <div class="face front">
          <div class="ftxt"><p class="fidx">결함 카드 ${CONTENT.cards.indexOf(c) + 1} · ${esc(c.name)}</p><h3 class="fhead">${esc(c.head)}</h3><p class="fline">${esc(c.line)}</p>
            <p style="margin-top:8px"><button class="btn" data-act="flip">카드 뒤집기</button></p></div>
          <div class="fart"><div class="bubble">뒤집으면 질문 3개가 나와요!</div><img src="${IMG.open}" alt="동국 캐릭터 아코"></div>
        </div>
        <div class="face back"><div>${c.scaffold.map(([t, q], i) => `<div class="qrow"><span class="qtag">${t}</span><div class="stack" style="gap:8px"><span>${esc(q)}</span><textarea class="ta" style="min-height:64px" data-afield="${i}" aria-label="${t} 질문에 대한 우리 조의 생각" placeholder="우리 조의 생각">${esc(ans[i] || "")}</textarea></div></div>`).join("")}</div></div>
      </div></div>
      <div class="row" style="justify-content:space-between">${guide("stand", "정답은 없어요. 생각과 이유를 함께 적어요.")}<div class="postbox"><button class="btn" data-act="post" data-k="reflect">모아보기에 올리기</button><span class="small muted" id="poststat-reflect">${postStat("reflect")}</span></div></div>
    </section>`;
  },
  plan() {
    const c = card();
    if (!c) return needCard();
    const v = S.verify[c.id] || {};
    const P = S.plan;
    const ta = (k, label, ph) => `<div class="field"><label for="p-${k}">${label}</label><textarea class="ta" id="p-${k}" data-pfield="${k}" placeholder="${ph}">${esc(P[k])}</textarea></div>`;
    return `
    <section class="stack">
      <div><p class="eyebrow">미래 학교 설계 · 해결책 토의</p><h2 class="title">우리 조의 미래 학교</h2><p class="lead">앞에서 들여다본 문제를 바탕으로, 이제 해결책을 세워요.</p></div>
      <div class="card stack">
        <div class="blank">
          <div class="ln"><span class="n">①</span><span class="fill">${esc(c.name)}</span><span>문제를 개선하기 위해</span></div>
          <div class="ln"><span class="n">②</span><span>우리는</span><input class="input" id="p-think" data-pfield="think" maxlength="80" placeholder="예: 학생의 마음은 사람이 직접 살펴야 한다" value="${esc(P.think)}"><span>라고 생각한다.</span></div>
          <div class="ln"><span class="n">③</span><span>따라서</span><input class="input" id="p-school" data-pfield="school" maxlength="60" placeholder="예: 측정 대신 대화가 있는" value="${esc(P.school)}"><span>학교가 필요하다.</span></div>
        </div>
        <div class="grid2">${ta("teacher", "이 학교에서 교사의 역할", "교사는 무엇을 하나요?")}${ta("student", "이 학교에서 학생의 역할", "학생은 무엇을 하나요?")}</div>
      </div>
      <div class="verify">
        <p class="eyebrow">우리 해결책 점검하기 · 검증 질문</p>

/* ---------------- board store (Firebase or this-device preview) ---------------- */
const Store = {
  mode: "connecting", posts: [], subs: [], db: null, err: "",
  emit() { this.subs.forEach(f => f()); },
  async init() {
    if (!FIREBASE_CONFIG) return this.useLocal();
    try {
      await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
      await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js");
      firebase.initializeApp(FIREBASE_CONFIG);
      this.db = firebase.firestore();
      this.db.collection(BOARD_COLLECTION).onSnapshot(snap => {
        this.posts = snap.docs.map(d => d.data()); this.mode = "live"; this.err = ""; this.emit();
      }, e => { this.mode = "error"; this.err = (e && e.code) || "연결 오류"; this.emit(); });
    } catch (e) { this.mode = "error"; this.err = "Firebase를 불러오지 못했어요"; this.emit(); }
  },
  useLocal() {
    this.mode = "local";
    const read = () => { try { this.posts = Object.values(JSON.parse(localStorage.getItem("dgfc-board") || "{}")); } catch (e) { this.posts = []; } this.emit(); };
    window.addEventListener("storage", e => { if (e.key === "dgfc-board") read(); });
    read();
  },
  async put(post) {
    if (this.mode === "live") return this.db.collection(BOARD_COLLECTION).doc(post.id).set(post);
    if (this.mode === "local") { let m = {}; try { m = JSON.parse(localStorage.getItem("dgfc-board") || "{}"); } catch (e) {} m[post.id] = post; localStorage.setItem("dgfc-board", JSON.stringify(m)); this.posts = Object.values(m); this.emit(); return; }
    throw new Error("not connected");
  },
  async clear() {
    if (this.mode === "live") { const snap = await this.db.collection(BOARD_COLLECTION).get(); await Promise.all(snap.docs.map(d => d.ref.delete())); return; }
    if (this.mode === "local") { try { localStorage.removeItem("dgfc-board"); } catch (e) {} this.posts = []; this.emit(); }
  }
};
function loadScript(src) { return new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); }); }

const postId = k => `${S.group}-${k}-${DEVICE}`;

function postStat(k) {
  const m = myPost(k);
  if (!m) return "아직 올리지 않았어요";
  const t = new Date(m.ts); return `올림 · ${t.getHours()}:${String(t.getMinutes()).padStart(2, "0")} (다시 누르면 수정돼요)`;
}
async function post(k) {
  const c = card(); if (!c || !S.group) return;
  const base = { id: postId(k), g: S.group, name: S.name.trim().slice(0, 12), kind: k, cardId: c.id, ts: Date.now() };
  let body;
  if (k === "reflect") body = { a: c.scaffold.map((_, i) => ((S.ans[c.id] || [])[i] || "").slice(0, 400)) };
  else { const v = S.verify[c.id] || {}; body = { think: S.plan.think.slice(0, 120), school: S.plan.school.slice(0, 120), teacher: S.plan.teacher.slice(0, 400), student: S.plan.student.slice(0, 400), pass: v.pass || "", why: (v.why || "").slice(0, 200) }; }
  const st = $("#poststat-" + k);
  if (st) st.textContent = "올리는 중…";
  try { await Store.put(Object.assign(base, body)); if (st) st.textContent = postStat(k); }
  catch (e) { if (st) st.textContent = "올리지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요."; }
}

  if (!(S.name && S.group) && S.view > 0) S.view = 0;
  const key = STEPS[S.view].key;
  $("#main").innerHTML = `<div class="stack">${SCREENS[key]()}${nav()}</div>`;
  $("#foot").innerHTML = `교육학교육론 2조 수업시연용 페이지 · 공식 학교 서비스가 아닙니다 · <button data-act="reset">${resetArmed ? "정말 지울까요? 한 번 더 누르기" : "내 기록 지우기"}</button>`;
}
function go(i) {
  i = Math.max(0, Math.min(i, STEPS.length - 1));
  if (i > 0 && !(S.name && S.group)) return;
  S.view = i; save(); render(); window.scrollTo({ top: 0 });
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled) return go(+g.dataset.go);
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "group") { S.group = +a.dataset.g; save(); renderRail(); document.querySelectorAll('[data-act="group"]').forEach(b => b.classList.toggle("on", +b.dataset.g === S.group)); syncReady(); }
  else if (act === "lib") { S.lib = +a.dataset.n; save(); render(); }
  else if (act === "pick") { S.card = a.dataset.c; S.flipped = false; save(); render(); }
  else if (act === "flip") { S.flipped = true; save(); $("#flip").classList.add("go"); }
  else if (act === "vpass") { const c = card(); S.verify[c.id] = Object.assign(S.verify[c.id] || {}, { pass: a.dataset.v }); save(); render(); }
  else if (act === "deep") { S.deepOpen = !S.deepOpen; save(); render(); }
  else if (act === "judge") { S.judge[a.dataset.n] = S.judge[a.dataset.n] === a.dataset.v ? null : a.dataset.v; save(); render(); }
  else if (act === "toggleboard") setBoard(!boardOn);
  else if (act === "post") post(a.dataset.k);
  else if (act === "bkind") { boardKind = a.dataset.k; render(); }
  else if (act === "focus") { focusId = a.dataset.id; showFocus(); }
  else if (act === "unfocus") { focusId = null; $("#present").hidden = true; }
  else if (act === "tstart") { const i = +a.dataset.i; T.idx = i; T.running = true; T.endsAt = Date.now() + STEPS[i].min * 60000; T.remain = null; render(); }
  else if (act === "tpause") { if (T.running) { T.remain = T.endsAt - Date.now(); T.running = false; } else { T.endsAt = Date.now() + T.remain; T.running = true; } render(); }
  else if (act === "tplus") { if (T.running) T.endsAt += 60000; else T.remain += 60000; render(); }
  else if (act === "tstop") { T.idx = null; T.running = false; render(); }
  else if (act === "bclear") { if (!clearArmed) { clearArmed = true; render(); setTimeout(() => { clearArmed = false; if (BOARD()) render(); }, 4000); } else { clearArmed = false; Store.clear().catch(() => {}); render(); } }
  else if (act === "reset") { if (!resetArmed) { resetArmed = true; render(); setTimeout(() => { resetArmed = false; if (!BOARD()) render(); }, 4000); } else { resetArmed = false; S = blank(); save(); render(); window.scrollTo({ top: 0 }); } }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.field) { S[t.dataset.field] = t.value; save(); if (t.dataset.field === "name") { renderRail(); syncReady(); } }
  else if (t.dataset.afield != null) { const c = card(); const arr = S.ans[c.id] || (S.ans[c.id] = []); arr[+t.dataset.afield] = t.value; save(); }
  else if (t.dataset.pfield) { S.plan[t.dataset.pfield] = t.value; save(); }
  else if (t.dataset.vfield) { const c = card(); S.verify[c.id] = Object.assign(S.verify[c.id] || {}, { why: t.value }); save(); }
});
function syncReady() {
  const ok = !!(S.name.trim() && S.group);
  const on = $("#readyOn"), off = $("#readyOff");
  if (on) on.hidden = !ok; if (off) off.hidden = ok;
  const nb = document.querySelector('.nav [data-go="1"]');
  if (nb) nb.disabled = !ok;
}
document.addEventListener("keydown", e => { if (e.key === "Escape") { focusId = null; $("#present").hidden = true; } });
window.addEventListener("hashchange", () => setBoard(location.hash === "#board"));
Store.subs.push(() => {
  if (BOARD()) { if (!document.activeElement || !document.activeElement.closest || !document.activeElement.closest("#main")) render(); else renderBoard(); }
  else ["reflect", "plan"].forEach(k => { const st = $("#poststat-" + k); if (st) st.textContent = postStat(k); });
});
render();
Store.init();
</script>

</body>
